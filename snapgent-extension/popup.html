<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #16161a;
      --surface: #1e1e24;
      --surface-2: #26262e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8ec;
      --muted: rgba(232, 232, 236, 0.6);
      --accent: #7c8cff;
      --ok: #3ddc97;
      --warn: #ffb454;
      --bad: #ff6b6b;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      width: min(340px, 100vw);
      max-width: 100vw;
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: clamp(12px, 4vw, 16px);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .ver {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--accent);
      background: rgba(124, 140, 255, 0.12);
      border: 1px solid rgba(124, 140, 255, 0.3);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .dot {
      flex: none;
      width: 9px;
      height: 9px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .dot.ok   { background: var(--ok);   box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.18); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.18); }
    .dot.bad  { background: var(--bad);  box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18); }

    .status-text { min-width: 0; flex: 1; }
    #state {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    #tools {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #servers {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    #servers:empty { display: none; }

    /* Buttons */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions .full { grid-column: 1 / -1; }

    button {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-2);
      transition: background 0.15s, transform 0.05s, border-color 0.15s;
    }
    button:hover { background: #30303a; border-color: rgba(255, 255, 255, 0.16); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .kofi {
      color: #ff8fa3;
      background: rgba(255, 105, 135, 0.12);
      border-color: rgba(255, 105, 135, 0.4);
    }
    .kofi:hover {
      background: rgba(255, 105, 135, 0.2);
      border-color: rgba(255, 105, 135, 0.6);
    }

    /* Footer */
    .hint {
      margin: 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }
    code {
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10.5px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>snapgentV3</h1>
      <span class="badge">DeepSeek</span>
    </header>

    <section class="card">
      <div class="status">
        <span id="dot" class="dot"></span>
        <div class="status-text">
          <div id="state">Bridge: …</div>
          <div id="tools"></div>
        </div>
      </div>
      <div id="servers"></div>
    </section>

    <div class="actions">
      <button class="ghost" id="reconnect">↻ Reconnect</button>
      <button class="ghost" id="restart">⟳ Restart</button>
      <button class="ghost full" id="settings">⚙ Settings</button>
      <button class="kofi full" id="kofi">♥ Ko-fi</button>
    </div>

    <p class="hint">
      Start with <code>start.bat</code>.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
